<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de viajes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form>
            <div class="input-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="Escribe tu usuario">
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Escribe tu contraseña">
            </div>
            <button type="button" class="boton" onclick="location.href='destinos.html'">Entrar</button>
        </form>
    </div>
</body>
</html>
